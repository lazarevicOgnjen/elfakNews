name: Pokreni prijavu ispita

on:
  schedule:
    - cron: '0 8 23 11 *'
    - cron: '0 8 31 12 *'
    - cron: '0 8 8 3 *'
    - cron: '0 8 31 5 *'
    - cron: '0 8 16 7 *'
    - cron: '0 8 3 9 *'

  workflow_dispatch:

jobs:
  pokreni-bot:
    runs-on: ubuntu-latest
    steps:
      - name: repo
        uses: actions/checkout@v4

      - name: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: libraries
        run: |
          pip install discord.py

      - name: discord
        env:
          bot: ${{ secrets.BOT }}
        run: |
          python prijava_ispita.py