name: bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
    - cron: '30 7 * * *'
    - cron: '0 11 * * *'
    - cron: '0 21 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Repo
        uses: actions/checkout@v4

      - name: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: libraries & playwright
        run: |
          pip install playwright discord.py
          playwright install chromium

      - name: scrapping
        env:
          email: ${{ secrets.EMAIL }}
          password: ${{ secrets.PASSWORD }}
          bot: ${{ secrets.BOT }}
        run: python main.py

      - name: save changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "updated by bot" && git push)